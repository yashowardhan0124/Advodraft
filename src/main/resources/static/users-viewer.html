<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Advodraft — Users</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0d0f14;color:#e2ddd6;font-family:'DM Sans',sans-serif;font-weight:300;padding:40px 32px;min-height:100vh}
h1{font-size:1.1rem;font-weight:400;letter-spacing:.06em;color:#888;margin-bottom:28px}
h1 span{color:#c8a456}

table{width:100%;border-collapse:collapse;font-size:13px}
thead tr{border-bottom:1px solid #2a2d35}
th{padding:10px 16px;text-align:left;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#555;font-weight:400}
td{padding:13px 16px;border-bottom:1px solid #1a1d24;vertical-align:middle}
tr:hover td{background:#13151c}
tr:last-child td{border-bottom:none}

.id{font-family:'DM Mono',monospace;font-size:12px;color:#555}
.name{color:#e2ddd6;font-weight:400}
.email{color:#888}
.date{color:#555;font-size:12px}

.badge{display:inline-block;background:#1a1d24;border:1px solid #2a2d35;border-radius:4px;padding:2px 8px;font-family:'DM Mono',monospace;font-size:11px;color:#555}

.toolbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.count{font-size:12px;color:#555}
.count span{color:#c8a456;font-weight:500}
.refresh{background:none;border:1px solid #2a2d35;color:#666;padding:7px 14px;border-radius:6px;font-size:12px;cursor:pointer;font-family:'DM Sans',sans-serif;transition:border-color .2s,color .2s}
.refresh:hover{border-color:#c8a456;color:#c8a456}

.empty{text-align:center;padding:60px;color:#444;font-size:13px}
.error{text-align:center;padding:60px;color:#7a3535;font-size:13px}
</style>
</head>
<body>

<h1>Advo<span>draft</span> — Users Table</h1>

<div class="toolbar">
  <div class="count">Total: <span id="count">—</span> users</div>
  <button class="refresh" onclick="load()">↻ Refresh</button>
</div>

<table>
  <thead>
    <tr>
      <th>ID</th>
      <th>Full Name</th>
      <th>Email</th>
      <th>Created At</th>
    </tr>
  </thead>
  <tbody id="tbody">
    <tr><td colspan="4"><div class="empty">Loading…</div></td></tr>
  </tbody>
</table>

<script>
async function load() {
  try {
    const res = await fetch('http://localhost:8080/api/users');
    const users = await res.json();
    document.getElementById('count').textContent = users.length;
    if (!users.length) {
      document.getElementById('tbody').innerHTML = '<tr><td colspan="4"><div class="empty">No users yet.</div></td></tr>';
      return;
    }
    document.getElementById('tbody').innerHTML = users.map(u => `
      <tr>
        <td><span class="badge">#${u.id}</span></td>
        <td class="name">${u.fullName ?? '—'}</td>
        <td class="email">${u.email}</td>
        <td class="date">${u.createdAt ? new Date(u.createdAt).toLocaleString('en-IN') : '—'}</td>
      </tr>`).join('');
  } catch {
    document.getElementById('tbody').innerHTML = '<tr><td colspan="4"><div class="error">Cannot reach API. Is Spring Boot running on port 8080?</div></td></tr>';
  }
}
load();
</script>
</body>
</html>
